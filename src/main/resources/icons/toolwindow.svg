<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
  <!-- Lens ring -->
  <circle cx="5.5" cy="5.5" r="4" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Hour hand -->
  <line x1="5.5" y1="5.5" x2="3.8" y2="3.4" stroke="#2563EB" stroke-width="1" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="5.5" y1="5.5" x2="5.5" y2="3" stroke="#2563EB" stroke-width="1" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="8.5" y1="8.5" x2="12" y2="12" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
</svg>