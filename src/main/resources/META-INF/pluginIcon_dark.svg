<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Lens fill -->
  <circle cx="16" cy="16" r="12" fill="#1E3A5F"/>
  <!-- Inner clock ring -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#3B82F6" stroke-width="1"/>
  <!-- Hour hand (~10 o'clock) -->
  <line x1="16" y1="16" x2="12" y2="11" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (12 o'clock) -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#93C5FD"/>
  <!-- Lens ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="25" y1="25" x2="34" y2="34" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>
</svg>